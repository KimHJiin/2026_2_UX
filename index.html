<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>심리테스트</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--lime:#c7ff29;--paper:#f6f4ec;--ink:#151515}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink)}button{cursor:pointer;font:inherit}header{height:65px;border-bottom:1px solid;display:flex;align-items:center;justify-content:space-between;padding:0 4%;position:relative;z-index:2}.brand{font-size:18px;font-weight:800;letter-spacing:-1px}.brand span{background:var(--lime);border:1px solid;padding:4px 7px;transform:rotate(-5deg);display:inline-block}nav{font:11px 'DM Mono',monospace;display:flex;gap:24px}nav button{border:0;background:none;font:inherit}.stage{height:calc(100dvh - 65px);position:relative;overflow:hidden}.view{position:absolute;inset:0;transition:opacity .4s,transform .4s;overflow:hidden}.view.hidden{opacity:0;pointer-events:none;transform:translateY(15px)}.eyebrow{display:flex;justify-content:space-between;padding:23px 4%;font:10px 'DM Mono',monospace;letter-spacing:.08em}.hero h1{position:relative;z-index:2;text-align:center;font:500 clamp(62px,10.4vw,162px)/.94 'Playfair Display',Georgia,serif;letter-spacing:-.075em;margin:clamp(15px,4vh,48px) 0 0}.hero h1 em{font-weight:500}.sub{position:absolute;left:5%;top:45%;width:190px;font-size:13px;line-height:1.65;z-index:3}.dome{position:absolute;left:50%;bottom:-42vw;transform:translateX(-50%);width:min(75vw,790px);height:min(75vw,790px);border-radius:50%;border:1.5px solid;background:var(--lime);z-index:1}.eyes{display:flex;gap:18px;position:absolute;top:18%;left:50%;transform:translateX(-50%)}.eye{width:85px;height:108px;background:var(--paper);border:2px solid;border-radius:50%;position:relative;overflow:hidden}.pupil{position:absolute;top:34px;left:26px;width:30px;height:42px;border-radius:50%;background:var(--ink)}.pill{position:absolute;background:var(--lime);border:1px solid;border-radius:50px;padding:9px 16px;font:10px 'DM Mono',monospace;z-index:4;animation:float 3s ease-in-out infinite alternate}.p1{top:30%;left:8%;transform:rotate(-9deg)}.p2{top:39%;right:9%;animation-delay:.8s}.p3{bottom:15%;right:10%;animation-delay:1.3s}.p4{bottom:23%;left:10%;animation-delay:.4s}.start{position:absolute;z-index:6;top:49%;left:50%;transform:translate(-50%,-50%);border:2px solid;background:var(--ink);color:var(--lime);border-radius:100px;padding:25px 48px;font:600 clamp(17px,2vw,25px) 'DM Sans',sans-serif;box-shadow:8px 9px 0 var(--lime);white-space:nowrap;transition:transform .2s,box-shadow .2s}.start:hover{transform:translate(-50%,-54%);box-shadow:12px 14px 0 var(--lime)}.micro{font:11px 'DM Mono',monospace}.test{background:var(--lime);padding:clamp(22px,5vh,60px) max(6%,calc((100vw - 960px)/2));display:flex;flex-direction:column;justify-content:center}.test-top{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:17px}.test h2{font:500 clamp(34px,5vw,70px)/1.14 'Playfair Display',Georgia,serif;letter-spacing:-.055em;margin:clamp(20px,5vh,55px) 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:1px solid;background:var(--paper);min-height:75px;padding:17px 20px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:transform .2s,background .2s}.choice:hover{transform:translateY(-3px);background:white}.choice b{font:11px 'DM Mono',monospace}.progress{height:5px;background:#9cbb2a;margin-top:27px}.progress div{height:100%;width:0;background:var(--ink);transition:width .3s}.restart{background:var(--ink);color:white;border:0;padding:15px 25px;margin-top:20px}.result-description{max-width:640px;font-size:17px;line-height:1.8}.popup-layer{position:fixed;inset:0;z-index:30;pointer-events:none}.popup-layer.is-blocking{pointer-events:auto}.popup-layer.is-blocking::before{content:"";position:absolute;inset:0;background:rgba(18,22,11,.13);pointer-events:auto;z-index:0;animation:dim-in .22s ease-out}.popup-layer.is-blocking .popup{z-index:1}.popup-layer.is-blocking .close{z-index:2}@keyframes dim-in{from{opacity:0}to{opacity:1}}.popup{position:absolute;width:min(390px,calc(100vw - 24px));background:var(--paper);border:1.5px solid;box-shadow:9px 10px 0 #0003;pointer-events:auto;animation:pop .24s ease-out}.popup:nth-child(even){background:#faffed}.popup-head{height:46px;background:var(--lime);border-bottom:1.5px solid;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font:10px 'DM Mono',monospace}.close-placeholder{width:35px;height:32px}.close{position:fixed;width:32px;height:32px;z-index:70;background:var(--paper);border:1px solid;display:grid;place-items:center;font-size:20px;pointer-events:none;will-change:transform,width,height,opacity}.popup-body{padding:23px}.popup h3{font:500 32px/1.1 'Playfair Display',Georgia,serif;letter-spacing:-.045em;margin:10px 0 12px}.popup p{font-size:13px;line-height:1.65;margin:0 0 20px}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{border:1px solid;background:var(--ink);color:white;padding:10px 13px;font:11px 'DM Mono',monospace}.actions button+button{background:transparent;color:var(--ink)}.toast{position:fixed;right:15px;bottom:15px;z-index:90;background:var(--ink);color:white;padding:14px;font:11px 'DM Mono',monospace}.footer-note{position:absolute;bottom:16px;right:4%;font:10px 'DM Mono',monospace;z-index:3}@keyframes float{to{translate:0 -11px}}@keyframes pop{from{opacity:0;transform:translateY(15px) scale(.95)}to{opacity:1;transform:none}}@media(max-width:650px){header{height:57px}nav{gap:9px;font-size:9px}.stage{height:calc(100dvh - 57px)}.hero h1{font-size:clamp(56px,13vw,90px);margin-top:10vh}.sub{top:38%;font-size:11px;width:145px}.dome{width:550px;height:550px;bottom:-350px}.eyes{top:12%}.eye{width:65px;height:84px}.pupil{left:19px;top:25px;width:24px;height:33px}.start{top:53%;padding:20px 30px}.pill{font-size:9px;padding:7px 11px}.p1{top:26%}.p2{top:34%}.p3{bottom:11%}.test{padding:22px 5%;justify-content:center}.test h2{font-size:clamp(31px,7vw,48px);margin:25px 0}.choices{grid-template-columns:1fr;gap:8px}.choice{min-height:54px;padding:12px}.popup-body{padding:17px}.popup h3{font-size:26px}.popup p{margin-bottom:13px}.popup-head{height:40px}}

/* Faux-product art is self-contained: no third-party ad server or image request. */
.popup.is-ad{width:min(430px,calc(100vw - 24px));background:#fffef8}
.popup.is-ad .popup-head{background:#fffef8}
.popup.is-ad .popup-body{padding:16px 19px 18px}
.popup.is-ad h3{margin:12px 0 8px;font-size:clamp(25px,2.35vw,34px)}
.popup.is-ad p{margin-bottom:13px}
.ad-poster{height:125px;border:1px solid var(--ink);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:var(--ad-color,#ddf778)}
.ad-poster::before{content:"";position:absolute;left:-45px;top:-55px;width:215px;height:215px;border:1.6px solid #151515;border-radius:50%;background:rgba(255,255,255,.24)}
.ad-poster::after{content:"";position:absolute;right:-45px;bottom:-105px;width:230px;height:230px;border:1.4px solid #151515;border-radius:50%;background:rgba(255,255,255,.2)}
.ad-graphic{z-index:1;position:relative;font-size:77px;line-height:1;filter:drop-shadow(8px 8px 0 #0002);transform:rotate(-10deg)}
.ad-sticker{position:absolute;z-index:2;top:10px;right:10px;padding:6px 10px;background:var(--paper);border:1px solid var(--ink);border-radius:50px;font:10px 'DM Mono',monospace;transform:rotate(9deg)}
.ad-meta{display:flex;justify-content:space-between;gap:8px;font:10px 'DM Mono',monospace;margin:10px 0 4px}
.popup.is-ad .actions button{background:var(--lime);color:var(--ink);font-weight:600}
.popup.is-ad .actions button+button{background:var(--paper)}
.popup.is-ad .no-dismiss-note{font-size:10px;opacity:.58;margin-top:9px;margin-bottom:0}
.popup.is-ad .popup-head span{font-size:10px;letter-spacing:.045em}
@media(max-height:680px){.ad-poster{height:95px}.ad-graphic{font-size:58px}.popup.is-ad h3{font-size:25px;margin:8px 0}.popup.is-ad .popup-body{padding:12px 16px}.popup.is-ad p{font-size:12px;line-height:1.4;margin-bottom:8px}}

/* Advertisement: a single self-contained poster image, without action buttons. */
.popup.is-ad{width:min(448px,calc(100vw - 24px));background:#fffdf6}
.popup.is-ad .popup-head{height:39px;background:#fffdf6}
.popup.is-ad .popup-body{padding:12px}
.ad-image{display:block;width:100%;height:auto;max-height:min(62vh,410px);object-fit:contain;border:1px solid var(--ink);background:#e9f7c7}
/* The reject button behaves as though it becomes disabled as the pointer arrives. */
.actions{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;gap:10px}
.action-slot{min-width:0;display:flex}
.actions .action-slot button{flex:1;min-height:48px;text-align:center;transition:background .16s,opacity .16s,filter .16s,transform .16s;white-space:normal;line-height:1.35}
.action-slot.reject button{background:transparent;color:var(--ink)}
.action-slot.reject.is-disabled button{opacity:.28;filter:grayscale(1);transform:scale(.97);cursor:not-allowed}
.action-slot.reject.is-disabled{cursor:not-allowed}
@media(max-width:650px){.popup.is-ad .popup-body{padding:8px}.actions{gap:6px}.actions .action-slot button{min-height:45px;padding:9px 7px;font-size:10px}}

/* Final experience: a one-screen signal failure and two alternate endings. */
.ending-layer{position:fixed;inset:0;z-index:100000;background:#070807;color:#f6f4ec;display:none;overflow:hidden;isolation:isolate}
.ending-layer.visible{display:block}
.ending-layer.signal{animation:signal-failure .65s steps(2,end) both}
.ending-layer.signal::before{content:"";position:absolute;inset:0;z-index:10;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,rgba(255,255,255,.15) 4px,transparent 6px),linear-gradient(90deg,rgba(199,255,41,.17),rgba(198,0,255,.13),rgba(255,255,255,.14));mix-blend-mode:screen;animation:signal-bars .1s infinite alternate}
.ending-layer.signal::after{content:"";position:absolute;inset:0;z-index:11;background:repeating-linear-gradient(90deg,transparent 0px,transparent 55px,rgba(255,255,255,.22) 59px,transparent 63px);animation:signal-bars .16s infinite reverse}
@keyframes signal-failure{0%,20%,50%,70%{transform:translate(0,0);filter:contrast(1)}10%,45%{transform:translate(-8px,2px);filter:invert(1)}30%,65%{transform:translate(11px,-5px);filter:hue-rotate(130deg)}100%{transform:none;filter:none}}
@keyframes signal-bars{from{transform:translate(-5%,1%);opacity:.7}to{transform:translate(5%,-2%);opacity:.98}}
.ending-text{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:min(920px,84vw);font-size:clamp(25px,4.2vw,64px);font-family:'DM Sans',sans-serif;font-weight:600;letter-spacing:-.055em;line-height:1.46;word-break:keep-all;white-space:pre-wrap}
.ending-text .cursor{display:inline-block;width:.075em;height:.95em;background:var(--lime);margin-left:.1em;vertical-align:-.12em;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ending-choice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(515px,calc(100vw - 36px));background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:12px 12px 0 var(--lime);opacity:0;animation:ending-enter .34s ease-out forwards}
@keyframes ending-enter{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
.ending-choice-head{background:var(--lime);height:44px;border-bottom:2px solid var(--ink);display:flex;align-items:center;padding:0 18px;font:11px 'DM Mono',monospace}
.ending-choice-content{padding:30px 28px 28px}
.ending-choice h2{font:500 clamp(30px,4.5vw,49px)/1.23 'Playfair Display',Georgia,serif;letter-spacing:-.05em;margin:0 0 28px;word-break:keep-all}
.ending-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ending-buttons button{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:17px 10px;min-height:59px;font-weight:600;font-size:13px;transition:transform .15s,background .15s}
.ending-buttons button:hover{transform:translateY(-3px)}
.ending-buttons button:last-child{background:var(--paper);color:var(--ink)}
.ending-flood{position:absolute;inset:0;overflow:hidden;background:#c7ff29}
.ending-flood-card{color:#151515;position:absolute;border:2px solid #171717;background:#f6f4ec;box-shadow:6px 7px 0 rgba(0,0,0,.24);display:flex;flex-direction:column;min-width:155px;opacity:0;transform:translateY(18px) scale(.91);animation:flood-in .17s cubic-bezier(.2,.8,.2,1) forwards}
.ending-flood-card:nth-child(3n){background:#c7ff29}.ending-flood-card:nth-child(5n){background:#fff}.ending-flood-card:nth-child(7n){background:#f3b1ee}
.ending-flood-title{padding:7px 10px;border-bottom:1.5px solid #171717;font:10px 'DM Mono',monospace;display:flex;justify-content:space-between}
.ending-flood-body{padding:18px 13px 22px;display:flex;align-items:center;font-weight:800;font-size:clamp(18px,2.2vw,30px);line-height:1.15;letter-spacing:-.045em;word-break:keep-all}
@keyframes flood-in{to{opacity:1;transform:none}}
@media(max-width:600px){.ending-choice-content{padding:25px 16px 20px}.ending-buttons{gap:7px}.ending-buttons button{font-size:11px;padding:12px 6px}.ending-text{font-size:clamp(24px,7vw,37px)}}

.start.aligned{transform:translateX(-50%)}

// Automatic arrivals use a shuffled 30% ads / 70% ordinary popups cycle.
let mixBag=[];
function nextPopupKind(){
  if(!mixBag.length){
    mixBag=[...Array(3).fill('ad'),...Array(7).fill('regular')];
    for(let i=mixBag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[mixBag[i],mixBag[j]]=[mixBag[j],mixBag[i]]}
  }
  return mixBag.pop();
}
let adCursor=0;

let index=0,scores=[0,0,0,0],total=0,sequence=0,active=[],started=false;
let spawnTimer=null,adLaunchTimer=null,firstPopupTimer=null;
let introStep=0,adsUnlocked=false,mouse={x:-999,y:-999};
let endingStarted=false,endingTimers=[];
// The finale is driven by the scripted popup sequence, never by click counts.
let finalePhase='idle',finaleTimers=[],approvalReceived=false,acceptOnlyShown=0;
const endingLayer=document.getElementById('endingLayer');
function endingDelay(callback,ms){endingTimers.push(setTimeout(callback,ms));}
function stopNormalPopups(){
  clearTimeout(spawnTimer);clearTimeout(adLaunchTimer);clearTimeout(firstPopupTimer);
  spawnTimer=null;adLaunchTimer=null;firstPopupTimer=null;
  active.forEach(el=>{el._stop=true;el._close?.remove()});
  active=[];layer.replaceChildren();syncPopupLock();
}
function beginEnding(){
  if(endingStarted)return;
  endingStarted=true;started=false;
  stopFinaleTimers();stopNormalPopups();
  endingLayer.className='ending-layer visible signal';
  endingLayer.replaceChildren();
  // A brief broken-signal moment cuts abruptly to black.
  endingDelay(()=>{endingLayer.className='ending-layer visible';typeEndingMessage()},850);
}
function typeEndingMessage(){
  const line=document.createElement('div');line.className='ending-text';
  const text=document.createElement('span'),cursor=document.createElement('span');
  cursor.className='cursor';cursor.setAttribute('aria-hidden','true');
  line.append(text,cursor);endingLayer.append(line);
  const message='팝업 광고 때문에 짜증 나셨던 적, 다들 있으시죠?\n네. 저희도 알고 있습니다.';
  let i=0;
  const write=()=>{
    if(i<message.length){
      text.textContent+=message[i++];
      endingDelay(write,message[i-1]==='\n'?320:57);
    }else{endingDelay(()=>{endingLayer.replaceChildren();endingDelay(showLastOffer,950)},1650)}
  };
  endingDelay(write,350);
}
function showLastOffer(){
  endingLayer.innerHTML=`<section class="ending-choice" role="dialog" aria-modal="true" aria-label="마지막 안내"><div class="ending-choice-head"><span>새로운 알림</span></div><div class="ending-choice-content"><h2>그런데 하나만 더 띄워도 될까요?</h2><div class="ending-buttons"><button id="endingYes">네 물론이죠 :)</button><button id="endingNo">그만하세요 이제</button></div></div></section>`;
  document.getElementById('endingNo').addEventListener('click',()=>{
    endingLayer.innerHTML='<section class="ending-choice ending-goodbye" role="status"><div class="ending-choice-head">새로운 알림</div><div class="ending-choice-content"><h2>네 알겠습니다ㅠ</h2></div></section>';
    endingDelay(()=>{endingLayer.replaceChildren();endingLayer.style.background='#000'},1450);
  });
  document.getElementById('endingYes').addEventListener('click',floodEnding);
}
function floodEnding(){
  endingLayer.replaceChildren();endingLayer.style.background='#c7ff29';
  const deck=document.createElement('div');deck.className='ending-flood';endingLayer.append(deck);
  const captions=['야호!','감사합니다!','팝업이다!','정말 좋아요!','하나 더!','특별 혜택!','기다리셨죠?','또 만났네요!','좋은 선택이에요!','서프라이즈!','축하합니다!','놓치지 마세요!','반가워요!','여기 또 있어요!','정말 감사합니다!','오늘도 팝업!','당신을 위한 알림!','마지막인 줄 알았죠?','팡!','팝업을 사랑해요!'];
  const count=Math.max(75,Math.min(125,Math.ceil(innerWidth*innerHeight/10500)));
  const showCard=i=>{
    const item=document.createElement('div');item.className='ending-flood-card';
    const w=150+Math.random()*160,h=98+Math.random()*80;
    const maxX=Math.max(0,innerWidth-w),maxY=Math.max(0,innerHeight-h);
    // Spread across screen, including all edges, rather than one pile in the center.
    const cols=Math.max(3,Math.ceil(Math.sqrt(count*innerWidth/innerHeight)));
    const rows=Math.max(3,Math.ceil(count/cols));
    const shuffled=(i*37)%count;
    const col=shuffled%cols,row=Math.floor(shuffled/cols)%rows;
    const x=Math.max(-25,Math.min(maxX+25,((col+.1+Math.random()*.8)/cols)*innerWidth-w*.34));
    const y=Math.max(-18,Math.min(maxY+18,((row+.1+Math.random()*.8)/rows)*innerHeight-h*.38));
    item.style.cssText=`left:${x}px;top:${y}px;width:${w}px;min-height:${h}px;z-index:${i+1};rotate:${(Math.random()-.5)*9}deg`;
    const title=document.createElement('div');title.className='ending-flood-title';
    const titleText=document.createElement('span');titleText.textContent='새로운 알림';
    const icon=document.createElement('span');icon.textContent='✳';title.append(titleText,icon);
    const body=document.createElement('div');body.className='ending-flood-body';body.textContent=captions[Math.floor(Math.random()*captions.length)];

// Intro narrative: approval/refusal -> double approval -> approval/refusal -> refusal confirmation.
const thirdIntro={title:'맞춤형 분석을 확인하시겠어요?',body:'답변에 어울리는 추가 분석과 추천 콘텐츠를 준비했어요. 지금 확인하시겠어요?',buttons:['네, 확인할게요','아니요, 괜찮아요'],rejectIndex:1};
const refusalConfirm={title:'정말 거절하시겠어요?',body:'이 내용을 건너뛰면 조금 아쉬울 수도 있어요. 지금 선택을 다시 확인해 주세요.',buttons:['아니요','잘못 눌렀어요'],rejectIndex:null};
const layer=document.getElementById('popupLayer');
const $=id=>document.getElementById(id);
const modes=['run','shrink','orbit','fake','jitter','decoy'];
let modeBag=[];
function nextMode(){
  if(!modeBag.length){modeBag=[...modes];for(let i=modeBag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[modeBag[i],modeBag[j]]=[modeBag[j],modeBag[i]]}}

}
function syncPopupLock(){

}
function show(id){['home','test'].forEach(k=>$(k).classList.toggle('hidden',k!==id))}

}
$('start').onclick=start;
$('testNav').onclick=()=>{if(!started)start();else show('test')};
$('homeNav').onclick=()=>show('home');

function answer(score){

function toast(msg){

function dismiss(el){

// Only answering/confirming the three introductory prompts advances the opening.

}
function stopFinaleTimers(){finaleTimers.forEach(clearTimeout);finaleTimers=[];}
function queueFirstAd(){
  if(finalePhase!=='idle')return;

}
function showYesNo(){

    data:{title:'새로운 콘텐츠를 확인하시겠어요?',body:'지금 확인하면 더 많은 추천 정보를 만나실 수 있어요. 잠깐만 살펴보실래요?',buttons:['네, 확인할게요','아니요, 괜찮아요'],rejectIndex:1},

}
function showYesNoAgain(){
  if(finalePhase!=='yes-no')return;
  spawn('custom',{
    data:{title:'잠깐, 정말 괜찮으세요?',body:'확인 버튼을 누르면 다음 안내로 넘어갑니다. 이번 한 번만 다시 물어볼게요.',buttons:['네, 확인할게요','지금은 안 볼래요'],rejectIndex:1},
    onChoose:(choice,el)=>{
      dismiss(el);

    }

}
function showAcceptOnlyPair(){
  if(finalePhase!=='yes-no')return;
  finalePhase='accept';approvalReceived=false;acceptOnlyShown=0;
  const makeAccept=(title,body,label)=>{
    acceptOnlyShown++;
    spawn('custom',{
      data:{title,body,buttons:[label],rejectIndex:null},
      onChoose:(choice,el)=>{
        if(finalePhase!=='accept')return;
        approvalReceived=true;
        dismiss(el);
        // Continue as soon as the two accept-only windows have appeared.
        if(acceptOnlyShown===2)beginCascade();
      }
    });
  };
  makeAccept('확인해 주셔서 감사해요!','추가 안내를 받아보실 준비가 되셨나요?','네, 수락할게요');
  finaleDelay(()=>{
    if(finalePhase!=='accept')return;
    makeAccept('한 번만 더 확인해 주세요','좋은 정보를 전달하려고요. 이번에도 확인해 주세요.','수락하고 계속하기');
    if(approvalReceived)beginCascade();

    else finaleDelay(()=>{if(finalePhase==='accept')beginCascade()},2000);

}
function beginCascade(){
  if(finalePhase!=='accept')return;
  finalePhase='cascade';
  spawn('regular');
  spawn('ad');
  // Two more notices arrive before the final notice.
  // After the FINAL notice appears, keep it visible for six full seconds.
  finaleDelay(()=>{
    if(finalePhase!=='cascade')return;
    spawn('regular'); // extra notice 1
    finaleDelay(()=>{
      if(finalePhase!=='cascade')return;
      spawn('regular'); // extra notice 2
      finaleDelay(()=>{
        if(finalePhase!=='cascade')return;
        spawn('regular'); // final notice
        finaleDelay(beginEnding,6000);
      },850);
    },850);
  },850);
}
function spawn(forced='regular',options={}){
  if(active.length>=10)return null;
  const isAd=forced==='ad',isCustom=forced==='custom';
  const isIntro1=forced==='intro1',isIntro2=forced==='intro2';
  const isIntro3=forced==='intro3',isConfirm=forced==='confirm';
  const data=isCustom?options.data:isAd?adData[(adCursor++)%adData.length]
    :isIntro3?thirdIntro:isConfirm?refusalConfirm
    :popupData[isIntro1?0:isIntro2?1:2+(sequence%Math.max(1,popupData.length-2))];
  const firstAd=isAd&&!window.__firstAdShown;
  if(firstAd)window.__firstAdShown=true;
  const mode=firstAd?'edge-run':nextMode();sequence++;total++;

  el.className='popup'+(isAd?' is-ad':'');

  if(isAd)el.dataset.persistent='true';

  const maxX=Math.max(12,innerWidth-w-12),maxY=Math.max(50,innerHeight-h-12);
  const x=Math.max(12,Math.min(maxX,innerWidth*.14+(sequence*157)%Math.max(130,innerWidth*.54)));
  const y=Math.max(50,Math.min(maxY,68+(sequence*89)%Math.max(110,innerHeight*.42)));
  el.style.left=x+'px';el.style.top=y+'px';
  // Every popup plus its X has its own ordered pair of z-index values.
  el.style.zIndex=String(total*2+1);
  const safe=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  el.innerHTML=isAd
    ?`<div class="popup-head"><span>스페셜 프로모션</span><div class="close-placeholder"></div></div><div class="popup-body"><img class="ad-image" alt="${safe(data.alt)}" src="${data.src}"></div>`
    :`<div class="popup-head"><span>새로운 알림</span><div class="close-placeholder"></div></div><div class="popup-body"><div class="micro">안내 메시지 ↗</div><h3>${safe(data.title)}</h3><p>${safe(data.body)}</p><div class="actions"></div></div>`;

        vel.y=vel.y*.91+dy*inv*push;
      }else{vel.x*=.90;vel.y*=.90;}
      pos.x+=vel.x;pos.y+=vel.y;size=32;
    }else if(mode==='run'){
      const dx=cx-mouse.x,dy=cy-mouse.y,inv=1/(d||1),force=near*9;
      vel.x=vel.x*.93+dx*inv*force+(target.x-pos.x)*.0018;
      vel.y=vel.y*.93+dy*inv*force+(target.y-pos.y)*.0018;
      pos.x+=vel.x;pos.y+=vel.y;size=32;
    }else if(mode==='shrink'){
      pos.x+=(target.x-pos.x)*.16;pos.y+=(target.y-pos.y)*.16;
      size+=(Math.max(2.5,32*(1-near*1.3))-size)*.22;
    }else if(mode==='orbit'){
      const radius=near>0?35+near*140:10,angle=t/(460-near*330)+phase;
      pos.x+=(target.x+Math.cos(angle)*radius-pos.x)*.15;
      pos.y+=(target.y+Math.sin(angle)*radius-pos.y)*.15;
      size=32;close.style.rotate=(t/8%360)+'deg';
    }else if(mode==='fake'){
      pos.x+=(target.x-pos.x)*.2;pos.y+=(target.y-pos.y)*.2;size=32;
      close.textContent=near>.3?(['↗','♡','?','⋯'][Math.floor(t/170)%4]):'×';
      close.style.borderRadius=near>.35?'50%':'0';
    }else if(mode==='jitter'){
      pos.x+=(target.x+(Math.sin(t/43+phase)*near*95)-pos.x)*.24;

    }else if(mode==='decoy'){
      pos.x+=(target.x-pos.x)*.2;pos.y+=(target.y-pos.y)*.2;size=32;
      close.textContent=near>.16?'·':'×';
      close.style.opacity=near>.25?String(.18+.20*(1+Math.sin(t/85))):'1';

    }

    pos.y=Math.max(4,Math.min(innerHeight-size-4,pos.y));

    close.style.width=size+'px';close.style.height=size+'px';

      b.addEventListener('click',e=>{e.preventDefault();});
    }else{
      b.addEventListener('click',()=>{
        dismiss(el);
        if(isIntro1){introStep=2;spawn('intro2');}
        else if(isIntro2){introStep=3;spawn('intro3');}
        else if(isConfirm){
          introStep=3;
          spawn('intro3');

        }else if(isIntro3){

          queueFirstAd();
        }else {spawn('regular');}
      });
    }
    slot.append(b);el.querySelector('.actions').append(slot);
  });

}
$('restart').onclick=()=>{

document.addEventListener('pointermove',e=>{

// Place the start button below the actual headline bounding box. The heading
// scales with viewport width, so a fixed percentage caused accidental overlap.
function alignHeroStart(){
  const button=document.getElementById('start');
  const hero=document.getElementById('home');
  const heading=hero.querySelector('h1');
  if(window.matchMedia('(max-width: 650px)').matches){
    button.style.removeProperty('top');
    button.classList.remove('aligned');
    return;
  }
  const heroBox=hero.getBoundingClientRect();
  const headingBox=heading.getBoundingClientRect();
  const desiredTop=headingBox.bottom-heroBox.top+26;
  const maximumTop=hero.clientHeight-button.offsetHeight-22;
  button.style.top=Math.max(0,Math.min(desiredTop,maximumTop))+'px';
  button.classList.add('aligned');
}

if(document.fonts&&document.fonts.ready)document.fonts.ready.then(alignHeroStart);
requestAnimationFrame(alignHeroStart);
