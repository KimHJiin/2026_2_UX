<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>심리테스트</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--lime:#c7ff29;--paper:#f6f4ec;--ink:#151515}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink)}button{cursor:pointer;font:inherit}header{height:65px;border-bottom:1px solid;display:flex;align-items:center;justify-content:space-between;padding:0 4%;position:relative;z-index:2}.brand{font-size:18px;font-weight:800;letter-spacing:-1px}.brand span{background:var(--lime);border:1px solid;padding:4px 7px;transform:rotate(-5deg);display:inline-block}nav{font:11px 'DM Mono',monospace;display:flex;gap:24px}nav button{border:0;background:none;font:inherit}.stage{height:calc(100dvh - 65px);position:relative;overflow:hidden}.view{position:absolute;inset:0;transition:opacity .4s,transform .4s;overflow:hidden}.view.hidden{opacity:0;pointer-events:none;transform:translateY(15px)}.eyebrow{display:flex;justify-content:space-between;padding:23px 4%;font:10px 'DM Mono',monospace;letter-spacing:.08em}.hero h1{position:relative;z-index:2;text-align:center;font:500 clamp(62px,10.4vw,162px)/.94 'Playfair Display',Georgia,serif;letter-spacing:-.075em;margin:clamp(15px,4vh,48px) 0 0}.hero h1 em{font-weight:500}.sub{position:absolute;left:5%;top:45%;width:190px;font-size:13px;line-height:1.65;z-index:3}.dome{position:absolute;left:50%;bottom:-42vw;transform:translateX(-50%);width:min(75vw,790px);height:min(75vw,790px);border-radius:50%;border:1.5px solid;background:var(--lime);z-index:1}.eyes{display:flex;gap:18px;position:absolute;top:18%;left:50%;transform:translateX(-50%)}.eye{width:85px;height:108px;background:var(--paper);border:2px solid;border-radius:50%;position:relative;overflow:hidden}.pupil{position:absolute;top:34px;left:26px;width:30px;height:42px;border-radius:50%;background:var(--ink)}.pill{position:absolute;background:var(--lime);border:1px solid;border-radius:50px;padding:9px 16px;font:10px 'DM Mono',monospace;z-index:4;animation:float 3s ease-in-out infinite alternate}.p1{top:30%;left:8%;transform:rotate(-9deg)}.p2{top:39%;right:9%;animation-delay:.8s}.p3{bottom:15%;right:10%;animation-delay:1.3s}.p4{bottom:23%;left:10%;animation-delay:.4s}.start{position:absolute;z-index:6;top:49%;left:50%;transform:translate(-50%,-50%);border:2px solid;background:var(--ink);color:var(--lime);border-radius:100px;padding:25px 48px;font:600 clamp(17px,2vw,25px) 'DM Sans',sans-serif;box-shadow:8px 9px 0 var(--lime);white-space:nowrap;transition:transform .2s,box-shadow .2s}.start:hover{transform:translate(-50%,-54%);box-shadow:12px 14px 0 var(--lime)}.micro{font:11px 'DM Mono',monospace}.test{background:var(--lime);padding:clamp(22px,5vh,60px) max(6%,calc((100vw - 960px)/2));display:flex;flex-direction:column;justify-content:center}.test-top{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:17px}.test h2{font:500 clamp(34px,5vw,70px)/1.14 'Playfair Display',Georgia,serif;letter-spacing:-.055em;margin:clamp(20px,5vh,55px) 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:1px solid;background:var(--paper);min-height:75px;padding:17px 20px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:transform .2s,background .2s}.choice:hover{transform:translateY(-3px);background:white}.choice b{font:11px 'DM Mono',monospace}.progress{height:5px;background:#9cbb2a;margin-top:27px}.progress div{height:100%;width:0;background:var(--ink);transition:width .3s}.restart{background:var(--ink);color:white;border:0;padding:15px 25px;margin-top:20px}.result-description{max-width:640px;font-size:17px;line-height:1.8}.popup-layer{position:fixed;inset:0;z-index:30;pointer-events:none}.popup-layer.is-blocking{pointer-events:auto}.popup-layer.is-blocking::before{content:"";position:absolute;inset:0;background:rgba(18,22,11,.13);pointer-events:auto;z-index:0;animation:dim-in .22s ease-out}.popup-layer.is-blocking .popup{z-index:1}.popup-layer.is-blocking .close{z-index:2}@keyframes dim-in{from{opacity:0}to{opacity:1}}.popup{position:absolute;width:min(390px,calc(100vw - 24px));background:var(--paper);border:1.5px solid;box-shadow:9px 10px 0 #0003;pointer-events:auto;animation:pop .24s ease-out}.popup:nth-child(even){background:#faffed}.popup-head{height:46px;background:var(--lime);border-bottom:1.5px solid;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font:10px 'DM Mono',monospace}.close-placeholder{width:35px;height:32px}.close{position:fixed;width:32px;height:32px;z-index:70;background:var(--paper);border:1px solid;display:grid;place-items:center;font-size:20px;pointer-events:none;will-change:transform,width,height,opacity}.popup-body{padding:23px}.popup h3{font:500 32px/1.1 'Playfair Display',Georgia,serif;letter-spacing:-.045em;margin:10px 0 12px}.popup p{font-size:13px;line-height:1.65;margin:0 0 20px}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{border:1px solid;background:var(--ink);color:white;padding:10px 13px;font:11px 'DM Mono',monospace}.actions button+button{background:transparent;color:var(--ink)}.toast{position:fixed;right:15px;bottom:15px;z-index:90;background:var(--ink);color:white;padding:14px;font:11px 'DM Mono',monospace}.footer-note{position:absolute;bottom:16px;right:4%;font:10px 'DM Mono',monospace;z-index:3}@keyframes float{to{translate:0 -11px}}@keyframes pop{from{opacity:0;transform:translateY(15px) scale(.95)}to{opacity:1;transform:none}}@media(max-width:650px){header{height:57px}nav{gap:9px;font-size:9px}.stage{height:calc(100dvh - 57px)}.hero h1{font-size:clamp(56px,13vw,90px);margin-top:10vh}.sub{top:38%;font-size:11px;width:145px}.dome{width:550px;height:550px;bottom:-350px}.eyes{top:12%}.eye{width:65px;height:84px}.pupil{left:19px;top:25px;width:24px;height:33px}.start{top:53%;padding:20px 30px}.pill{font-size:9px;padding:7px 11px}.p1{top:26%}.p2{top:34%}.p3{bottom:11%}.test{padding:22px 5%;justify-content:center}.test h2{font-size:clamp(31px,7vw,48px);margin:25px 0}.choices{grid-template-columns:1fr;gap:8px}.choice{min-height:54px;padding:12px}.popup-body{padding:17px}.popup h3{font-size:26px}.popup p{margin-bottom:13px}.popup-head{height:40px}}
