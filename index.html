<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEOMETRIC SOUND</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Unbounded:wght@700&display=swap');

*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#fff;
  color:#14151f;
}

body{
  font-family:"IBM Plex Mono",monospace;
}

canvas{
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  touch-action:none;
}

.top,.bottom{
  position:fixed;
  left:0;
  right:0;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  pointer-events:none;
}

.top{
  top:0;
}

.bottom{
  bottom:0;
}

.group{
  display:flex;
  align-items:center;
  gap:8px;
  pointer-events:auto;
  flex-wrap:wrap;
}

button{
  font:500 11px "IBM Plex Mono",monospace;
  color:#14151f;
  border:1.5px solid #14151f;
  background:rgba(255,255,255,.94);
  padding:9px 11px;
  cursor:pointer;
}

button:hover,
button.active{
  background:#14151f;
  color:#fff;
}

@media(max-width:700px){
  .top,.bottom{
    padding:9px;
    gap:6px;
    align-items:flex-start;
  }

  button{
    font-size:9px;
    padding:8px;
  }

  .bottom{
    align-items:flex-end;
  }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="top">
  <div class="group">
    <button id="soundButton">SOUND ON</button>
    <button id="resetButton">RESET</button>
  </div>
</div>

<div class="bottom">
  <div class="group">
    <button id="addShapeButton">+ ADD SHAPE</button>
  </div>
</div>

<script>


const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const soundButton = document.getElementById("soundButton");
const resetButton = document.getElementById("resetButton");
const addShapeButton = document.getElementById("addShapeButton");




const palettes = [
  {
    name:"CANDY",
    colors:[
      "#F5B7C8",
      "#F7D68A",
      "#A9D8E8",
      "#C7B5E8",
      "#F2A98B",
      "#C8E0A5",
      "#E8C5E8"
    ]
  }
];




const shapeTypes = [
  "circle",
  "square",
  "triangle",
  "line",
  "dot",
  "roundedRect"
];



let shapes = [];

let currentCollisions = [];

let selectedShape = -1;
let isDragging = false;

let soundOn = true;
let audioContext = null;

let width = 0;
let height = 0;
let dpr = 1;

let lastMouseX = 0;
let lastMouseY = 0;

let mouseX = -100;
let mouseY = -100;

let mouseVX = 0;
let mouseVY = 0;

let mouseRadius = 24;
let mouseDown = false;




function resizeCanvas(){

  dpr = Math.min(window.devicePixelRatio || 1,2);

  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = width * dpr;
  canvas.height = height * dpr;

  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resizeCanvas);




function randomNumber(min,max){
  return Math.random() * (max-min) + min;
}




function getRadius(shape){

  if(shape.type === "line"){
    return shape.size * 1.1;

  }else if(shape.type === "dot"){
    return shape.size + 4;

  }else{
    return shape.size * 0.8;
  }
}



function makeShape(type,x,y){

  let size = randomNumber(12,42);

  let colorIndex =
    Math.floor(Math.random() * palettes[0].colors.length);

  let newShape = {

    type:type,

    x:x,
    y:y,

    size:size,

    color:palettes[0].colors[colorIndex],

    // 평소에는 거의 움직이지 않음
    vx:0,
    vy:0,

    rotation:randomNumber(0,6.28),

    rotationSpeed:randomNumber(-0.003,0.003),

    hit:0
  };

  return newShape;
}




function makeShapes(){

  shapes = [];

  currentCollisions = [];

  for(let i=0;i<32;i++){

    let typeIndex =
      Math.floor(Math.random() * shapeTypes.length);

    let x =
      randomNumber(35,width-35);

    let y =
      randomNumber(75,height-75);

    let newShape =
      makeShape(
        shapeTypes[typeIndex],
        x,
        y
      );

    shapes.push(newShape);
  }
}




function addRandomShape(){

  let typeIndex =
    Math.floor(Math.random() * shapeTypes.length);

  let margin = 60;

  let x =
    randomNumber(
      margin,
      width-margin
    );

  let y =
    randomNumber(
      75,
      height-75
    );

  let newShape =
    makeShape(
      shapeTypes[typeIndex],
      x,
      y
    );

  shapes.push(newShape);
}



function drawShape(shape){

  ctx.save();

  ctx.translate(
    shape.x,
    shape.y
  );

  ctx.rotate(
    shape.rotation
  );

  let scale =
    1 + shape.hit * 0.18;

  if(
    shapes[selectedShape] === shape &&
    isDragging
  ){
    scale = 1.12;
  }

  ctx.scale(
    scale,
    scale
  );

  ctx.fillStyle = shape.color;
  ctx.strokeStyle = shape.color;

  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";


  

  if(shape.type === "circle"){

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      shape.size,
      0,
      Math.PI*2
    );

    ctx.fill();


  

  }else if(shape.type === "square"){

    ctx.fillRect(
      -shape.size,
      -shape.size,
      shape.size*2,
      shape.size*2
    );


 

  }else if(shape.type === "triangle"){

    ctx.beginPath();

    ctx.moveTo(
      0,
      -shape.size
    );

    ctx.lineTo(
      shape.size,
      shape.size
    );

    ctx.lineTo(
      -shape.size,
      shape.size
    );

    ctx.closePath();

    ctx.fill();


  

  }else if(shape.type === "line"){

    ctx.beginPath();

    ctx.moveTo(
      -shape.size*1.5,
      0
    );

    ctx.lineTo(
      shape.size*1.5,
      0
    );

    ctx.stroke();


  

  }else if(shape.type === "dot"){

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      shape.size*0.28,
      0,
      Math.PI*2
    );

    ctx.fill();


  

  }else if(shape.type === "roundedRect"){

    ctx.beginPath();

    ctx.roundRect(
      -shape.size*1.2,
      -shape.size*0.7,
      shape.size*2.4,
      shape.size*1.4,
      8
    );

    ctx.fill();
  }


  

  if(
    shapes[selectedShape] === shape &&
    isDragging
  ){

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      shape.size+9,
      0,
      Math.PI*2
    );

    ctx.strokeStyle = "#14151f";
    ctx.lineWidth = 1.2;

    ctx.stroke();
  }

  ctx.restore();
}




function getDistance(
  x1,
  y1,
  x2,
  y2
){

  let dx = x2-x1;
  let dy = y2-y1;

  return Math.sqrt(
    dx*dx + dy*dy
  );
}



function startAudio(){

  if(audioContext === null){

    let AudioClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if(AudioClass){
      audioContext = new AudioClass();
    }
  }

  if(
    audioContext &&
    audioContext.state === "suspended"
  ){
    audioContext.resume();
  }
}




function playCollisionSound(
  shapeA,
  shapeB,
  force
){

  if(!soundOn){
    return;
  }

  startAudio();

  if(audioContext === null){
    return;
  }

  let oscillator =
    audioContext.createOscillator();

  let gain =
    audioContext.createGain();




  if(
    shapeA.type === "circle" ||
    shapeB.type === "circle"
  ){

    oscillator.type = "sine";

  }else if(
    shapeA.type === "triangle" ||
    shapeB.type === "triangle"
  ){

    oscillator.type = "square";

  }else if(
    shapeA.type === "line" ||
    shapeB.type === "line"
  ){

    oscillator.type = "sawtooth";

  }else{

    oscillator.type = "triangle";
  }



  let frequency =
    220 + Math.min(force*90,650);

  let volume =
    Math.min(
      0.18,
      0.035 + force*0.025
    );

  let now =
    audioContext.currentTime;


  oscillator.frequency.setValueAtTime(
    frequency,
    now
  );

  gain.gain.setValueAtTime(
    0.001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    now+0.015
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now+0.22
  );

  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );

  oscillator.start(now);

  oscillator.stop(
    now+0.23
  );
}



function checkCollisions(){

  let newCollisions = [];


  for(
    let i=0;
    i<shapes.length;
    i++
  ){

    for(
      let j=i+1;
      j<shapes.length;
      j++
    ){

      let a = shapes[i];
      let b = shapes[j];

      let dx =
        b.x-a.x;

      let dy =
        b.y-a.y;

      let distance =
        Math.sqrt(
          dx*dx + dy*dy
        );

      let minDistance =
        getRadius(a) +
        getRadius(b);


      if(distance < minDistance){

        let key =
          i + "-" + j;

        newCollisions.push(key);


        if(distance === 0){
          distance = 0.1;
        }


        let normalX =
          dx/distance;

        let normalY =
          dy/distance;

        let overlap =
          minDistance-distance;



        a.x -=
          normalX *
          overlap *
          0.5;

        a.y -=
          normalY *
          overlap *
          0.5;

        b.x +=
          normalX *
          overlap *
          0.5;

        b.y +=
          normalY *
          overlap *
          0.5;


       

        let relativeX =
          b.vx-a.vx;

        let relativeY =
          b.vy-a.vy;

        let speed =
          relativeX*normalX +
          relativeY*normalY;


        

        if(speed < 0){

          
          let bounce = 0.85;

          a.vx +=
            normalX *
            speed *
            bounce;

          a.vy +=
            normalY *
            speed *
            bounce;

          b.vx -=
            normalX *
            speed *
            bounce;

          b.vy -=
            normalY *
            speed *
            bounce;


         
          a.vx *= 0.45;
          a.vy *= 0.45;

          b.vx *= 0.45;
          b.vy *= 0.45;
        }


       

        let wasColliding =
          currentCollisions.includes(key);


        if(!wasColliding){

          let force =
            Math.abs(speed) + 0.4;

          playCollisionSound(
            a,
            b,
            force
          );

          a.hit = 1;
          b.hit = 1;
        }
      }
    }
  }


  
  for(
    let i=0;
    i<shapes.length;
    i++
  ){

    let shape = shapes[i];

    let dx =
      shape.x-mouseX;

    let dy =
      shape.y-mouseY;

    let distance =
      Math.sqrt(
        dx*dx + dy*dy
      );

    let minDistance =
      getRadius(shape) +
      mouseRadius;


    if(
      distance < minDistance &&
      mouseDown
    ){

      if(distance === 0){
        distance = 0.1;
      }


      let normalX =
        dx/distance;

      let normalY =
        dy/distance;

      let overlap =
        minDistance-distance;


      

      shape.x +=
        normalX *
        overlap;

      shape.y +=
        normalY *
        overlap;


     
      let push =
        Math.sqrt(
          mouseVX*mouseVX +
          mouseVY*mouseVY
        );


     
      shape.vx +=
        normalX *
        (push*0.18+0.08);

      shape.vy +=
        normalY *
        (push*0.18+0.08);


     

      shape.vx =
        Math.max(
          -1.2,
          Math.min(
            1.2,
            shape.vx
          )
        );

      shape.vy =
        Math.max(
          -1.2,
          Math.min(
            1.2,
            shape.vy
          )
        );


      shape.hit = 1;


     
      if(push > 0.15){

        let cursorKey =
          "mouse-" + i;

        let alreadyHit =
          currentCollisions.includes(
            cursorKey
          );


        if(!alreadyHit){

          playCollisionSound(
            shape,
            shape,
            Math.min(
              push+0.4,
              3
            )
          );

          newCollisions.push(
            cursorKey
          );
        }
      }
    }
  }


  currentCollisions =
    newCollisions;
}



function findShape(x,y){

  for(
    let i=shapes.length-1;
    i>=0;
    i--
  ){

    let distance =
      getDistance(
        x,
        y,
        shapes[i].x,
        shapes[i].y
      );

    if(
      distance <
      getRadius(shapes[i])+12
    ){
      return i;
    }
  }

  return -1;
}



canvas.addEventListener(
  "pointerdown",
  function(e){

    startAudio();

    let rect =
      canvas.getBoundingClientRect();

    let x =
      e.clientX-rect.left;

    let y =
      e.clientY-rect.top;


    mouseX = x;
    mouseY = y;

    mouseVX = 0;
    mouseVY = 0;

    mouseDown = true;


    selectedShape =
      findShape(x,y);

    lastMouseX = x;
    lastMouseY = y;


    if(selectedShape !== -1){

      isDragging = true;

      canvas.setPointerCapture(
        e.pointerId
      );
    }
  }
);



canvas.addEventListener(
  "pointermove",
  function(e){

    let rect =
      canvas.getBoundingClientRect();

    let x =
      e.clientX-rect.left;

    let y =
      e.clientY-rect.top;


    let moveX =
      x-lastMouseX;

    let moveY =
      y-lastMouseY;


    mouseVX = moveX;
    mouseVY = moveY;

    mouseX = x;
    mouseY = y;


    if(
      isDragging &&
      selectedShape !== -1
    ){

      let shape =
        shapes[selectedShape];


     

      shape.x += moveX;
      shape.y += moveY;


      

      shape.vx =
        moveX*0.04;

      shape.vy =
        moveY*0.04;
    }


    lastMouseX = x;
    lastMouseY = y;
  }
);




canvas.addEventListener(
  "pointerup",
  function(){

    isDragging = false;

    selectedShape = -1;

    mouseDown = false;

    mouseVX = 0;
    mouseVY = 0;
  }
);


canvas.addEventListener(
  "pointercancel",
  function(){

    isDragging = false;

    selectedShape = -1;

    mouseDown = false;

    mouseVX = 0;
    mouseVY = 0;
  }
);


canvas.addEventListener(
  "pointerleave",
  function(){

    mouseX = -100;
    mouseY = -100;

    mouseDown = false;
  }
);



soundButton.onclick = function(){

  soundOn = !soundOn;


  if(soundOn){

    startAudio();

    soundButton.innerHTML =
      "SOUND ON";

  }else{

    soundButton.innerHTML =
      "SOUND OFF";
  }
};




resetButton.onclick = function(){

  makeShapes();
};



addShapeButton.onclick = function(){

  startAudio();

  addRandomShape();
};




window.addEventListener(
  "keydown",
  function(e){

    if(e.code === "Space"){

      e.preventDefault();

      soundButton.click();
    }
  }
);



function animate(){

  ctx.clearRect(
    0,
    0,
    width,
    height
  );


 

  if(mouseDown){

    ctx.beginPath();

    ctx.arc(
      mouseX,
      mouseY,
      mouseRadius,
      0,
      Math.PI*2
    );

    ctx.strokeStyle =
      "#14151f";

    ctx.lineWidth = 1.5;

    ctx.stroke();
  }


  

  for(
    let i=0;
    i<shapes.length;
    i++
  ){

    let shape = shapes[i];


     

    if(
      !(isDragging &&
      selectedShape === i)
    ){

      shape.x += shape.vx;
      shape.y += shape.vy;
    }


   

    shape.rotation +=
      shape.rotationSpeed;


    
    if(
      shape.x < 20 ||
      shape.x > width-20
    ){

      shape.vx *= -0.75;

      shape.x =
        Math.max(
          20,
          Math.min(
            width-20,
            shape.x
          )
        );
    }


    if(
      shape.y < 45 ||
      shape.y > height-35
    ){

      shape.vy *= -0.75;

      shape.y =
        Math.max(
          45,
          Math.min(
            height-35,
            shape.y
          )
        );
    }


   

    let maxSpeed = 1.4;

    shape.vx =
      Math.max(
        -maxSpeed,
        Math.min(
          maxSpeed,
          shape.vx
        )
      );

    shape.vy =
      Math.max(
        -maxSpeed,
        Math.min(
          maxSpeed,
          shape.vy
        )
      );


   
    shape.vx *= 0.94;
    shape.vy *= 0.94;


    // 아주 작은 속도는 완전히 정지

    if(Math.abs(shape.vx) < 0.015){
      shape.vx = 0;
    }

    if(Math.abs(shape.vy) < 0.015){
      shape.vy = 0;
    }


   
    shape.hit *= 0.88;


    drawShape(shape);
  }


  

  checkCollisions();


  requestAnimationFrame(
    animate
  );
}




resizeCanvas();

makeShapes();

animate();

</script>

</body>
</html>
